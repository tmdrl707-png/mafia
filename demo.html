<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>마피아 마을 체험</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --day:#BFE3F0; --dusk:#F2B98F; --dawn:#FBE3C8; --night:#1E2350;
  --ink:#1C2142; --lamp:#F4C24D; --blood:#D7425E; --ghost:#5FCFAE; --cit:#3E7BE6;
  --fd:'Black Han Sans','Pretendard','Apple SD Gothic Neo',sans-serif;
  --fb:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{font-family:var(--fb);background:var(--bg);color:var(--fg);min-height:100vh;
  transition:background-color 1.4s ease,color .9s ease;-webkit-tap-highlight-color:transparent;line-height:1.5;word-break:keep-all}
body.day  {--bg:var(--day); --fg:var(--ink);--card:#fff;    --card2:#E4F2F8;--line:rgba(28,33,66,.14);--muted:#52608A;--hi:var(--lamp)}
body.dusk {--bg:var(--dusk);--fg:#2B1D2E;   --card:#FFF6EE; --card2:#FBE1CE;--line:rgba(43,29,46,.15);--muted:#7B5856;--hi:#FFE08A}
body.dawn {--bg:var(--dawn);--fg:#2B2340;   --card:#FFFDF8; --card2:#F7E9D6;--line:rgba(43,35,64,.14);--muted:#76657A;--hi:var(--lamp)}
body.night{--bg:var(--night);--fg:#EEF0FF;  --card:#2B3172; --card2:#252B66;--line:rgba(238,240,255,.15);--muted:#A9AFDD;--hi:var(--lamp)}

/* 하늘: 해와 달 */
#sky{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
#sky::before{content:"";position:absolute;inset:0;opacity:0;transition:opacity 1.4s;
  background-image:radial-gradient(1.5px 1.5px at 12% 18%,#fff 60%,transparent),radial-gradient(1px 1px at 28% 8%,#fff 60%,transparent),
  radial-gradient(1.5px 1.5px at 45% 22%,#fff 60%,transparent),radial-gradient(1px 1px at 63% 12%,#fff 60%,transparent),
  radial-gradient(1px 1px at 82% 30%,#fff 60%,transparent),radial-gradient(1.5px 1.5px at 8% 48%,#fff 60%,transparent),
  radial-gradient(1px 1px at 37% 40%,#fff 60%,transparent),radial-gradient(1px 1px at 92% 55%,#fff 60%,transparent)}
body.night #sky::before{opacity:.7}
#orb{position:absolute;width:min(30vw,260px);aspect-ratio:1;border-radius:50%;right:-6vw;top:-8vw;transition:all 1.6s cubic-bezier(.6,0,.3,1)}
body.day #orb{background:radial-gradient(circle,#FFE38A 0 55%,#FFD25E 56% 100%);box-shadow:0 0 90px 30px rgba(255,214,94,.45)}
body.dusk #orb{background:#FF9F6E;box-shadow:0 0 80px 20px rgba(255,140,90,.4);top:auto;bottom:-10vw;right:8vw}
body.dawn #orb{background:#FFE7B8;box-shadow:0 0 70px 20px rgba(255,231,184,.6);top:auto;bottom:-12vw;right:-4vw}
body.night #orb{background:#F4F0DC;box-shadow:inset -28px -14px 0 0 #D9D3B8,0 0 60px 6px rgba(244,240,220,.18)}
body.tv #orb{width:34vh;left:50%;right:auto;top:-19vh;bottom:auto;transform:translateX(-50%)}
body.tv.dusk #orb,body.tv.dawn #orb{top:-25vh;bottom:auto;right:auto}
#app{position:relative;z-index:1}

button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
button:disabled{opacity:.45;cursor:default}
:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
input{font:inherit}
.muted{color:var(--muted)}
h1,h2,h3{font-weight:800;line-height:1.25}

/* ========== 입장 화면 ========== */
.E{max-width:440px;margin:0 auto;padding:9vh 20px 40px}
.E-title{font-family:var(--fd);font-weight:400;font-size:56px;line-height:1;letter-spacing:-.5px}
.E-hero p{margin:14px 0 28px;color:var(--muted);font-size:16px}
.E-card{background:var(--card);border-radius:22px;padding:22px;display:grid;gap:14px}
.E-card label{display:grid;gap:6px;font-weight:700;font-size:14px}
.E-card input{border:2px solid var(--line);background:var(--card2);color:var(--fg);border-radius:14px;padding:14px 16px;font-size:18px;outline:none}
.E-card input:focus{border-color:var(--hi)}
.E details{margin-top:6px}
.E summary{cursor:pointer;color:var(--muted);font-size:14px;padding:6px 0}
.E details .E-sub{display:grid;gap:10px;margin-top:8px}
.err{color:var(--blood);font-weight:700;min-height:1.2em;font-size:14px}
.E-teacher{margin-top:26px}
.E-demo{margin-top:18px}
.E-demo h3{font-size:18px}
.E-card select{border:2px solid var(--line);background:var(--card2);color:var(--fg);border-radius:14px;padding:12px 14px;font-size:17px;font-family:var(--fb)}
#demobar{position:fixed;left:50%;bottom:calc(10px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;
  display:none;gap:6px;align-items:center;background:#1C2142;color:#fff;border-radius:999px;padding:6px;box-shadow:0 6px 24px rgba(0,0,0,.3);max-width:calc(100vw - 16px);overflow-x:auto}
body.demo #demobar{display:flex}
body.demo #app{padding-bottom:76px}
#demobar button{color:#fff;font-weight:800;font-size:13px;padding:9px 12px;border-radius:999px;white-space:nowrap}
#demobar button.on{background:var(--lamp);color:#1C2142}
#demobar .db-ph{font-size:12px;opacity:.75;padding:0 6px;white-space:nowrap}
@media (max-width:520px){#demobar .db-ph{display:none}#demobar button{padding:9px 10px;font-size:12px}}
.note{margin-top:18px;font-size:13px;color:var(--muted);background:var(--card2);padding:12px 14px;border-radius:12px}
.btn{background:var(--lamp);color:#1C2142;font-weight:800;border-radius:16px;padding:14px 18px;font-size:17px}
.btn.big{width:100%;padding:18px;font-size:19px}
.btn.ghosty{background:var(--card2);color:var(--fg)}
.resume{display:block;width:100%;margin-bottom:12px}

/* ========== 선생님 화면 ========== */
.T{min-height:100vh;display:grid;grid-template-rows:auto 1fr auto;gap:2.4vh;padding:3.2vh 3vw 2vh}
.T-head{display:flex;align-items:flex-end;justify-content:space-between;gap:2vw}
.T-title{font-family:var(--fd);font-weight:400;font-size:min(6.4vw,10vh);line-height:1}
.T-sub{color:var(--muted);font-size:min(1.5vw,2.4vh);margin-top:1vh}
.T-day{font-size:min(1.8vw,3vh);font-weight:800;color:var(--muted);display:flex;gap:12px;align-items:center}
.T-day small{font-weight:600;font-size:.8em}
.tag-final{background:var(--blood);color:#fff;border-radius:999px;padding:2px 12px;font-size:.8em}
.T-phase{font-family:var(--fd);font-weight:400;font-size:min(6vw,9.5vh);line-height:1.05}
.T-timer{font-family:var(--fd);font-size:min(11vw,17vh);line-height:.9;font-variant-numeric:tabular-nums;letter-spacing:-2px}
.T-timer.low{color:var(--blood)}
.T-timer.paused{opacity:.4}
.T-count{font-size:min(2vw,3.4vh);font-weight:700}
.T-count b{font-family:var(--fd);font-weight:400;font-size:2.2em;margin-right:4px}
.T-main{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:3vw;min-height:0}
.T-stage{min-width:0;display:flex;flex-direction:column;gap:2vh;font-size:min(1.7vw,2.9vh)}
.lead{font-family:var(--fd);font-weight:400;font-size:min(3.3vw,5.6vh);line-height:1.15}
.pts{list-style:none;display:grid;gap:1.2vh}
.pts li{padding-left:1.3em;position:relative}
.pts li::before{content:"";position:absolute;left:.2em;top:.62em;width:.42em;height:.42em;border-radius:50%;background:var(--hi)}
.prog{font-family:var(--fd);font-size:min(3vw,5vh)}
.prog small{font-family:var(--fb);font-size:.45em;color:var(--muted);margin-left:8px}
.clues{background:var(--card);border-radius:20px;padding:2vh 1.6vw;display:grid;gap:1vh}
.clues h3,.mo h3{font-size:.9em;color:var(--muted)}
.wh p,.sus p{font-size:1em}
.wh b{display:inline-grid;place-items:center;width:1.6em;height:1.6em;border-radius:50%;background:var(--fg);color:var(--bg);font-size:.8em;margin-right:6px;vertical-align:.1em}
.wh small{color:var(--muted);font-size:.78em}
.mo{display:grid;gap:1.6vh}
.mo-line{font-family:var(--fd);font-weight:400;font-size:min(2.7vw,4.6vh);line-height:1.2}
.mo-line.kill{color:var(--blood)}
.mo-block{background:var(--card);border-radius:20px;padding:1.8vh 1.6vw;display:grid;gap:.8vh}
.vd{display:grid;gap:1vh}
.vd-name{font-family:var(--fd);font-size:min(5vw,8.5vh);line-height:1.05}
.vd-name.none{font-size:min(3.4vw,6vh)}
.vd-rev{font-size:min(2.4vw,4vh);font-weight:800}
.vd-last{color:var(--muted)}
.bars{display:grid;gap:.8vh;margin-top:1vh}
.barr{display:grid;grid-template-columns:9em 1fr 2em;align-items:center;gap:10px;font-size:.92em}
.barr span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.barr i{display:block;height:1.1em;border-radius:6px;background:var(--fg);width:var(--w);min-width:4px;opacity:.75}
.barr b{text-align:right}
.T-village{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:1.4vh 1vw;align-content:start}
.tok{position:relative;aspect-ratio:1/1.08;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;padding-top:22%;
  clip-path:polygon(50% 0,100% 30%,100% 100%,0 100%,0 30%);transition:opacity .6s,background-color 1s}
.tok b{font-family:var(--fd);font-weight:400;font-size:min(2.8vw,4.6vh);line-height:1}
body.night .tok:not(.dead) b{color:var(--lamp);text-shadow:0 0 14px rgba(244,194,77,.55)}
.tok span{font-size:min(1.15vw,1.9vh);font-weight:700;max-width:92%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tok.dead{opacity:.6;background:rgba(28,33,66,.10)}
body.night .tok.dead{background:rgba(238,240,255,.07)}
.tok .tk-sub{font-size:min(.95vw,1.5vh);color:var(--muted);font-style:normal}
.tok .tk-ok{position:absolute;bottom:6%;right:10%;font-style:normal;font-weight:900;color:var(--ghost);font-size:min(1.4vw,2.2vh)}
.tok .tk-bot{position:absolute;bottom:6%;left:10%;font-style:normal;font-size:min(.9vw,1.4vh);color:var(--muted)}
.tok .tk-role{position:absolute;top:9%;left:50%;transform:translateX(-50%);font-style:normal;font-size:min(1.3vw,2.1vh)}
.tok.t-mafia{background:#F6C6CF}
body.night .tok.t-mafia{background:#6A2C4F}
.tok[data-a]{cursor:pointer}
.empty{grid-column:1/-1;color:var(--muted);padding:3vh 0}
.T-ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;opacity:.5;transition:opacity .3s}
.T-ctrl:hover,.T-ctrl:focus-within{opacity:1}
.T-ctrl button{background:var(--card);border-radius:10px;padding:8px 14px;font-size:14px;font-weight:700}
.T-ctrl button.primary{background:var(--lamp);color:#1C2142;padding:12px 26px;font-size:17px;opacity:1}
.T-lobby .T-ctrl{opacity:1}
.grow{flex:1}
.sep{width:12px}
.join{display:flex;gap:2vw;align-items:center;background:var(--card);border-radius:22px;padding:2vh 1.6vw}
.qr{background:#fff;padding:10px;border-radius:14px;line-height:0;min-width:120px;min-height:120px}
.qr img,.qr canvas{width:min(13vw,21vh)!important;height:auto!important}
.join-code{font-family:var(--fd);font-size:min(7vw,12vh);line-height:1;letter-spacing:4px}
.join-lbl{color:var(--muted);font-weight:700}
.join-url{font-size:min(1.2vw,2vh);color:var(--muted);word-break:break-all;margin-top:.6vh}
.set{background:var(--card);border-radius:20px;padding:1.4vh 1.4vw;font-size:14px}
.set summary{cursor:pointer;font-weight:800;font-size:15px;list-style:none}
.set summary::-webkit-details-marker{display:none}
.set-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px;margin-top:12px}
.set-row{display:flex;align-items:center;gap:8px}
.set-row span{flex:1}
.set-row b{min-width:2.6em;text-align:center}
.set-row button{background:var(--card2);width:30px;height:30px;border-radius:9px;font-weight:900}
.set h4{grid-column:1/-1;margin-top:10px;font-size:13px;color:var(--muted)}
.seg{display:flex;gap:4px}
.set-row.full{grid-column:1/-1}
.seg button{white-space:nowrap}
.seg button{background:var(--card2);border-radius:9px;padding:5px 10px;font-weight:700;font-size:13px}
.seg button.on{background:var(--lamp);color:#1C2142}
.set-row .seg button{width:auto;height:auto;padding:5px 12px;background:var(--card2)}
.set-row .seg button.on{background:var(--lamp);color:#1C2142}
.warn{color:var(--blood);font-weight:800}
.end{display:grid;gap:1.6vh}
.end-win{font-family:var(--fd);font-size:min(5.4vw,9vh);line-height:1.05}
.aw{display:grid;grid-template-columns:1fr 1fr;gap:1.2vh 1.2vw}
.aw div{background:var(--card);border-radius:16px;padding:1.4vh 1vw;display:grid;gap:2px}
.aw span{font-size:1.4em}
.aw small{color:var(--muted)}
.aw em{font-style:normal;font-weight:700}
.T-ctrl.solid{opacity:1}

/* 오버레이 */
.ov{position:fixed;inset:0;z-index:20;background:rgba(15,18,45,.72);display:grid;place-items:center;padding:4vh 4vw}
.ov-box{background:var(--card);color:var(--fg);border-radius:24px;padding:3vh 2.4vw;max-width:1100px;width:100%;max-height:92vh;overflow:auto}
.slide{min-height:62vh;display:flex;flex-direction:column;gap:3vh;justify-content:center;font-size:min(2.1vw,3.4vh)}
.slide h2{font-family:var(--fd);font-weight:400;font-size:min(4.8vw,8vh);line-height:1.1}
.slide .big{font-size:1.25em;font-weight:800}
.flow{display:grid;grid-template-columns:repeat(5,1fr);gap:1vw}
.flow div{background:var(--card2);border-radius:16px;padding:2vh 1vw;display:grid;gap:.6vh}
.flow b{font-size:1.4em}
.flow small{color:var(--muted);font-size:.8em}
.two{display:grid;grid-template-columns:1fr 1fr;gap:2vw}
.two div{background:var(--card2);border-radius:18px;padding:2.4vh 1.6vw}
.rolegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.2vh 1.2vw;font-size:.82em}
.rolegrid div{background:var(--card2);border-radius:14px;padding:1.4vh 1vw}
.rolegrid b{display:block;font-size:1.1em}
.sl-nav{display:flex;justify-content:space-between;align-items:center;margin-top:2vh}
.sl-nav button{background:var(--card2);border-radius:12px;padding:10px 18px;font-weight:800}
.adm{width:100%;border-collapse:collapse;font-size:15px}
.adm th,.adm td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left}
.adm tr.dead td{opacity:.5}

/* ========== 학생 화면 ========== */
.S{max-width:520px;margin:0 auto;padding:0 14px 40px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;
  padding:12px 4px;background:var(--bg);transition:background-color 1.4s}
.bar .me{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .me b{font-family:var(--fd);font-weight:400;font-size:22px;margin-right:6px}
.bar .ph{font-size:13px;color:var(--muted);font-weight:700;text-align:right;line-height:1.2}
.bar .js-timer{display:none}
.bar .js-timer.low{color:var(--blood)}
.bar button{background:var(--card);border-radius:12px;padding:8px 10px;font-size:13px;font-weight:800}
.s-card{background:var(--card);border-radius:20px;padding:18px;margin-top:12px}
.s-card h3{font-size:17px;margin-bottom:6px;display:flex;justify-content:space-between;gap:8px}
.s-card h3 small{color:var(--muted);font-weight:700}
.s-card p+p{margin-top:6px}
.hero{text-align:center;padding:8vh 10px 2vh}
.hero .big-num{font-family:var(--fd);font-size:96px;line-height:1}
.hero h2{font-size:24px;margin-top:8px}
.hero p{color:var(--muted);margin-top:8px}
.pocket{text-align:center;padding:7vh 12px 3vh}
.pocket .pi{font-size:84px;line-height:1}
.pocket h2{font-family:var(--fd);font-weight:400;font-size:34px;line-height:1.15;margin-top:14px}
.pocket p{margin-top:10px;color:var(--muted)}
.rolecard{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation;cursor:pointer;
  border-radius:22px;background:var(--card2);min-height:200px;display:grid;place-items:center;text-align:center;padding:22px;position:relative}
.rolecard .rc-face{display:none}
.rolecard.show .rc-face{display:block}
.rolecard.show .rc-cover{display:none}
.rc-cover{color:var(--muted);font-weight:800;font-size:17px}
.rc-cover i{display:block;font-style:normal;font-size:44px;margin-bottom:6px}
.rc-emoji{font-size:60px;line-height:1}
.rc-name{font-family:var(--fd);font-size:44px;line-height:1.1;margin-top:6px}
.rc-team{display:inline-block;margin-top:6px;padding:2px 12px;border-radius:999px;font-weight:800;font-size:14px;background:var(--cit);color:#fff}
.rc-team.mafia{background:var(--blood)}
.rc-desc{margin-top:12px;text-align:left;font-size:15px}
.codebox{margin-top:4px}
.codebox p{font-size:15px}
.codebox b{font-size:17px}
.ok{color:#1E9E73;font-weight:900}
.no{color:var(--blood);font-weight:900}
.chips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.chip{background:var(--card2);border-radius:14px;padding:10px 6px;display:grid;gap:2px;justify-items:center;border:2px solid transparent;position:relative;min-height:62px}
.chip b{font-family:var(--fd);font-weight:400;font-size:20px;line-height:1}
.chip span{font-size:13px;font-weight:700;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip.on{background:var(--lamp);color:#1C2142;border-color:#1C2142}
.chip.wide{grid-column:span 3;min-height:48px;font-weight:800}
.chip .pk{position:absolute;top:-8px;right:-4px;background:var(--blood);color:#fff;font-style:normal;font-size:10px;font-weight:800;border-radius:8px;padding:1px 6px}
.chips .empty{grid-column:1/-1}
.done-msg{text-align:center;color:var(--muted);font-weight:700;margin-top:10px}
.sbtn{margin-top:16px}
.news .mo-line{font-size:22px}
.news p{margin-top:8px}
.logs p{padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.logs p:last-child{border-bottom:none}
.logs small{color:var(--muted);margin-right:6px;font-weight:700}
.drawer{position:fixed;inset:0;z-index:30;background:rgba(15,18,45,.55);display:none}
.drawer.open{display:block}
.dr-in{position:absolute;inset:auto 0 0 0;max-height:88vh;overflow:auto;background:var(--bg);border-radius:24px 24px 0 0;padding:16px 14px calc(30px + env(safe-area-inset-bottom,0px))}
.dr-top{display:flex;justify-content:space-between;align-items:center}
.dr-top h2{font-size:20px}
.dr-top button{background:var(--card);border-radius:12px;padding:8px 14px;font-weight:800}
.mates{font-weight:700;margin-top:4px}
.hint{text-align:center;color:var(--muted);margin-top:18px;font-weight:700}
.endbox{text-align:center;padding:5vh 10px 1vh}
.endbox .end-win{font-size:40px}
.endbox .me-res{font-size:22px;font-weight:900;margin-top:10px}
.rl p{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)}
.rl p.m{color:var(--blood);font-weight:800}
.S .vd-name{font-size:30px}.S .vd-name.none{font-size:24px}.S .vd-rev{font-size:18px}.S .bars{font-size:15px}.S .barr{grid-template-columns:7.5em 1fr 2em}

@media (max-width:900px){

<script>
'use strict';
/* =====================================================================
   마피아 마을 (기본형 v3) — 7~30명 교실용 마피아 게임
   - 직업: 마피아 · 경찰 · 의사 · 시민
   - 광장 재판: 후보 지명(남은 마피아 수만큼) → 최후의 발언 → 최종 판정(과반이면 처형)
   - 처형된 사람의 정체는 비공개, 아침마다 생존 인원과 남은 마피아 수만 발표
   - 죽은 사람은 유령: 마피아는 마피아 편, 그 밖의 사람은 편을 직접 고름
     유령은 밀담에 참여하고 광장 재판 동안 엎드림, 밤마다 '영혼 투시'로 1명의 직업 확인
   ===================================================================== */

// 체험용: 서버 없이 이 브라우저 안에서만 동작
const FIREBASE_CONFIG = null;
const TEACHER_PW = '0815';
const ROOT = 'mafia';
const MIN_PLAYERS = 10, MAX_PLAYERS = 30;

/* ---------------- DB (Firebase 또는 로컬 테스트) ---------------- */
const clean = v => (v === undefined ? null : JSON.parse(JSON.stringify(v)));
const DB = (function () {
  if (FIREBASE_CONFIG && window.firebase) {
    firebase.initializeApp(FIREBASE_CONFIG);
    const db = firebase.database();
    let offset = 0;
    db.ref('.info/serverTimeOffset').on('value', s => { offset = s.val() || 0; });
    const R = p => db.ref(ROOT + '/' + p);
    return {
      mode: 'firebase',
      now: () => Date.now() + offset,
      get: p => R(p).once('value').then(s => s.val()),
      set: (p, v) => R(p).set(clean(v)),
      update: (p, o) => R(p).update(clean(o)),
      on: (p, cb) => { const r = R(p); const h = s => cb(s.val()); r.on('value', h); return () => r.off('value', h); },
      remove: p => R(p).remove(),
      onConn: cb => db.ref('.info/connected').on('value', s => cb(!!s.val()))
    };
  }
  // ---- 로컬 테스트용: localStorage 공유 (같은 브라우저의 여러 탭). 저장소가 막혀 있으면 메모리에만 ----
  const KEY = 'mafiaDemoDB';
  const load = () => { try { const r = localStorage.getItem(KEY); return r ? JSON.parse(r) : {}; } catch (e) { return null; } };
  let tree = load() || {};
  const subs = new Set();
  const segs = p => (ROOT + '/' + p).split('/').filter(Boolean);
  const getAt = p => { let n = tree; for (const s of segs(p)) { if (n == null || typeof n !== 'object') return null; n = n[s]; } return n === undefined ? null : n; };
  const prune = v => {
    if (v === null || v === undefined) return null;
    if (Array.isArray(v)) { const a = v.map(prune).filter(x => x !== null); return a.length ? a : null; }
    if (typeof v === 'object') { const o = {}; for (const k in v) { const c = prune(v[k]); if (c !== null) o[k] = c; } return Object.keys(o).length ? o : null; }
    return v;
  };
  const setAt = (p, v) => {
    const ss = segs(p); v = prune(clean(v));
    let n = tree;
    for (let i = 0; i < ss.length - 1; i++) { if (n[ss[i]] == null || typeof n[ss[i]] !== 'object') n[ss[i]] = {}; n = n[ss[i]]; }
    const last = ss[ss.length - 1];
    if (v === null) delete n[last]; else n[last] = v;
  };
  const fire = () => {
    for (const s of subs) {
      const v = getAt(s.p); const j = JSON.stringify(v);
      if (j !== s.last) { s.last = j; s.cb(v == null ? null : JSON.parse(j)); }
    }
  };
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(tree)); } catch (e) {} fire(); };
  window.addEventListener('storage', e => { if (e.key === KEY) { tree = load() || tree; fire(); } });
  return {
    mode: 'local',
    now: () => Date.now(),
    get: p => Promise.resolve(clean(getAt(p))),
    set: (p, v) => { tree = load() || tree; setAt(p, v); save(); return Promise.resolve(); },
    update: (p, o) => {
      const ks = Object.keys(o);
      for (const a of ks) for (const b of ks) if (a !== b && b.startsWith(a + '/')) throw new Error('경로 충돌: ' + a + ' / ' + b);
      tree = load() || tree; for (const k of ks) setAt(p + '/' + k, o[k]); save(); return Promise.resolve();
    },
    remove: p => { tree = load() || tree; setAt(p, null); save(); return Promise.resolve(); },
    onConn: cb => cb(true),
    on: (p, cb) => {
      const s = { p, cb, last: JSON.stringify(getAt(p)) }; subs.add(s);
      setTimeout(() => cb(clean(getAt(p))), 0);
      return () => subs.delete(s);
    }
  };
})();

/* ---------------- 공통 도구 ---------------- */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const rid = n => Array.from({ length: n }, () => 'abcdefghijkmnpqrstuvwxyz23456789'[Math.floor(Math.random() * 32)]).join('');
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const arr = x => !x ? [] : Array.isArray(x) ? x.filter(v => v != null) : Object.values(x);
const hasB = w => { w = String(w); const c = w.charCodeAt(w.length - 1); return c >= 0xAC00 && c <= 0xD7A3 && (c - 0xAC00) % 28 !== 0; };
const josa = (w, noB, withB) => w + (hasB(w) ? withB : noB);
const fmt = ms => { const s = Math.max(0, Math.ceil(ms / 1000)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const memStore = (() => { const m = {}; return { getItem: k => (k in m ? m[k] : null), setItem: (k, v) => { m[k] = String(v); }, removeItem: k => { delete m[k]; } }; })();
const safeStore = get => { try { const s = get(); s.setItem('__t', '1'); s.removeItem('__t'); return s; } catch (e) { return memStore; } };
const store = DB.mode === 'local' ? safeStore(() => sessionStorage) : safeStore(() => localStorage);

/* ---------------- 게임 데이터 ---------------- */
const ROLE_ORDER = ['mafia', 'police', 'doctor', 'citizen'];
const ROLES = {
  mafia:   { name: '마피아', team: 'mafia',   emoji: '🔪', short: '밤마다 동료와 함께 1명을 암살' },
  police:  { name: '경찰',   team: 'citizen', emoji: '🚓', short: '밤마다 마피아인지 조사' },
  doctor:  { name: '의사',   team: 'citizen', emoji: '💉', short: '밤마다 1명을 암살에서 지킴' },
  citizen: { name: '시민',   team: 'citizen', emoji: '🙂', short: '대화와 추리로 마피아를 찾음' }
};
const SKILL = '영혼 투시';
function roleDesc(r) {
  const pk = ST().pk; const team = compNow().police > 1;
  return {
    mafia: '첫날 밤 동료 확인<br>둘째 밤부터 각자 1명 암살',
    police: `밤마다 ${pk}명 조사${team ? '<br>결과는 경찰끼리 공유 (서로는 몰라요)' : ''}`,
    doctor: '둘째 밤부터 1명 보호<br>같은 사람 연속 X',
    citizen: '추리로 마피아를 찾아요'
  }[r];
}
const LIMITS = { mafia: [1, 9], police: [0, 5], doctor: [0, 5] };
const BOT_NAMES = ['다람쥐','부엉이','고슴도치','수달','너구리','펭귄','판다','여우','코알라','햄스터','오리','거북이','토끼','고래','사슴','두더지','미어캣','알파카','치타','물개','앵무새','하마','기린','족제비','고양이','강아지','다슬기','올빼미','청설모','호랑이'];
const COURT = ['court', 'nominate', 'runoff', 'defense', 'judge', 'verdict'];
const PH = {
  lobby:    { name: '입장',        icon: '🏠', sky: 'night' },
  role:     { name: '직업 확인',   icon: '📱', sky: 'night', phone: true },
  talk:     { name: '밀담',        icon: '📵', sky: 'day' },
  court:    { name: '광장 토론',   icon: '🏛️', sky: 'day' },
  nominate: { name: '후보 지명',   icon: '🗳️', sky: 'dusk', phone: true },
  runoff:   { name: '결선 투표',   icon: '🔁', sky: 'dusk', phone: true },
  defense:  { name: '최후의 발언', icon: '🎤', sky: 'dusk' },
  judge:    { name: '최종 판정',   icon: '⚖️', sky: 'dusk', phone: true },
  verdict:  { name: '판결',        icon: '🔨', sky: 'dusk' },
  night:    { name: '밤',          icon: '🌙', sky: 'night', phone: true },
  morning:  { name: '아침',        icon: '☀️', sky: 'dawn', phone: true },
  end:      { name: '게임 끝',     icon: '🏁', sky: 'night' }
};

// 인원별 추천 구성 [마피아, 경찰, 의사]: 인원마다 시뮬레이션해서 시민 승률이 50%에 가장 가까운 조합
const COMP_BY_N = {10:[3,2,1],11:[3,1,3],12:[3,1,2],13:[3,1,2],14:[4,2,2],15:[4,2,2],16:[5,3,2],17:[4,2,2],18:[5,3,2],19:[5,2,3],20:[5,2,3],21:[5,2,3],22:[5,2,3],23:[6,3,3],24:[6,3,3],25:[6,3,3],26:[6,3,2],27:[6,3,2],28:[6,3,2],29:[7,4,3],30:[7,3,4]};
function defaultComp(n) {
  n = Math.max(MIN_PLAYERS, Math.min(MAX_PLAYERS, n || 24));
  const r = COMP_BY_N[n];
  return { mafia: r[0], police: r[1], doctor: r[2] };
}
function defaultSettings() {
  return { comp: null, pk: 1 };
}

/* ---------------- 상태 ---------------- */
const App = { mode: null, code: null, pid: null, hostId: null, active: false, busy: false, admin: false, demo: false, view: 'phone',
              slides: false, slide: 0, sound: true, lastKey: '', hostKey: '', drawer: false, setOpen: false, lookSel: null, sideSel: null, unsub: [], timers: [] };
let S = {};

const ST = () => Object.assign(defaultSettings(), (S.meta && S.meta.settings) || {});
const P = id => (S.players || {})[id] || {};
const nm = id => P(id).name || '?';
const num = id => P(id).num || '?';
const who = id => `${num(id)}번 ${nm(id)}`;
const sortedIds = () => Object.keys(S.players || {}).sort((a, b) => (P(a).num || 999) - (P(b).num || 999) || (P(a).joined || 0) - (P(b).joined || 0));
const isAlive = id => P(id).alive !== false;
const aliveIds = () => sortedIds().filter(isAlive);
const deadIds = () => sortedIds().filter(id => !isAlive(id));
const sec = id => (S.secret || {})[id] || {};

/* ---- 광장 재판 ---- */

// 득표순 상위 K명. 경계에서 동점이라 K명을 넘으면, 확정된 사람(fixed)과 결선에 갈 동점자(tied)로 나눔

/* ---- 밤 ---- */

        if (a === 'pchk') { let ns = arr(A.ns); if (ns.includes(id)) ns = ns.filter(x => x !== id); else { if (ns.length >= ST().pk) { if (ST().pk === 1) ns = []; else return; } ns = [...ns, id]; } return W({ ns }); }
        if (a === 'sus') return W({ s: A.s === id ? null : id });
        if (a === 'nightDone') return W({ nd: true });
      } else {
        if (!sideOf(App.pid)) return;
        if (a === 'lsel') { if (A.look || arr(sc.looks).length) return; App.lookSel = App.lookSel === id ? null : id; return rerender(); }
        if (a === 'look') { if (A.look || !App.lookSel || arr(sc.looks).length) return; return W({ look: App.lookSel }); }
        if (a === 'nightDone') return W({ nd: true });
      }
    }
  }
}
// 최후의 발언: 다음 발언자로 넘기기, 마지막 사람이면 최종 판정으로
function nextSpeaker() {
  const sp = speaker(); if (!sp || !App.active) return advance();
  if (sp.last) return advance();
  return DB.update(roomPath('meta'), { spk: sp.i + 1, spkAt: DB.now() });
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el || el.disabled) return;
  if (el.tagName === 'SUMMARY') e.preventDefault();
  onAction(el.dataset.a, el);
});
document.addEventListener('keydown', e => {
  if (App.mode === 'teacher' && App.slides) {
    if (e.key === 'ArrowRight') { App.slide++; renderOverlay(); }
    if (e.key === 'ArrowLeft') { App.slide--; renderOverlay(); }
    if (e.key === 'Escape') { App.slides = false; renderOverlay(); }
  }
  if (e.key === 'Enter' && e.target.id === 'inName') studentJoin();
  // 선생님 화면: → / PageDown(발표용 리모컨)으로 다음 단계
  const tv = App.mode === 'teacher' && App.active && !App.slides && !App.admin && S.meta && S.meta.phase !== 'end' && S.meta.phase !== 'lobby';
  if (tv && (e.key === 'ArrowRight' || e.key === 'PageDown') && !/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) { e.preventDefault(); goNext(); }
});
// 직업 카드: 꾹 누르는 동안만 보이기
document.addEventListener('pointerdown', e => { const h = e.target.closest('.hold'); if (h) h.classList.add('show'); });
['pointerup', 'pointercancel'].forEach(t => document.addEventListener(t, () => document.querySelectorAll('.hold.show').forEach(x => x.classList.remove('show'))));
document.addEventListener('contextmenu', e => { if (e.target.closest('.hold')) e.preventDefault(); });

/* 시작 */
(function init() { renderEntry(); })();
